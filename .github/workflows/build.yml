name: Build and Release SpriteSize

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

# Даем серверу права на запись и создание Релизов
permissions:
  contents: write

jobs:
  # ================= СБОРКА ПОД WINDOWS =================
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Disable Windows Apps Python Alias
      run: |
        Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\python.exe" -Name "(Default)" -ErrorAction SilentlyContinue
        Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\python3.exe" -Name "(Default)" -ErrorAction SilentlyContinue

    - name: Install Qt 6.5.3
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: ''

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: |
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -G "NMake Makefiles" ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Deploy Windows Binary (windeployqt)
      run: |
        cd build
        & "windeployqt" --qmldir ../qml spritesize.exe

    # Упаковываем Windows-сборку в ZIP прямо в шаге сборки
    - name: Pack Windows Release
      run: |
        cd build
        Compress-Archive -Path * -DestinationPath ../SpriteSize-Windows.zip

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Windows-Zip
        path: SpriteSize-Windows.zip

  # ================= СБОРКА ПОД LINUX =================
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev

    - name: Install Qt 6.5.3
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        host: 'linux'
        target: 'desktop'
        modules: ''

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Prepare Linux Package
      run: |
        mkdir -p dist
        cp build/spritesize dist/
        cp build/spritesize_en.qm dist/
        cp build/spritesize_ru.qm dist/
        # Упаковываем Linux-сборку в TAR.GZ archive
        tar -czvf SpriteSize-Linux.tar.gz -C dist .

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Linux-Tar
        path: SpriteSize-Linux.tar.gz

  # ================= АВТОМАТИЧЕСКАЯ ПУБЛИКАЦИЯ РЕЛИЗА =================
  create-release:
    needs: [build-windows, build-linux] # Ждем окончания обеих сборок
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: SpriteSize-Windows-Zip

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: SpriteSize-Linux-Tar

    # Создаем официальный Релиз на главной странице и загружаем туда тяжелые файлы через API
    - name: Deploy GitHub Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "SpriteSize-Windows.zip,SpriteSize-Linux.tar.gz"
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        tag: "v1.0.0"
        name: "SpriteSize v1.0.0 (Stable)"
        body: |
          ### 🎉 Первый официальный релиз утилиты SpriteSize!
          
          Автоматическая кроссплатформенная сборка для геймдева.
          
          **Что внутри:**
          * Пакетный ресайз изображений (Nearest Neighbor) для четкого Pixel-Art.
          * Безопасная система бэкапов с временными метками.
          * Интерактивный менеджер ассетов с предпросмотром на шахматном фоне.
          * Динамическая локализация (RU/EN) на лету.
