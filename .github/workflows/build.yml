name: Build SpriteSize

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  # ================= СБОРКА ПОД WINDOWS (Qt 6.11) =================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Подключаем MSVC компилятор Visual Studio (стандарт для сборки qt_add_executable на Windows)
    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # Официальный инструмент установки. Скачивает ГОТОВЫЕ бинарники Qt 6.11 за 2 минуты
    - name: Install Qt 6.11
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.11.2' # Или '6.11.0', ставит готовую фабричную сборку
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022' # Идеально совпадает с msvc-dev-cmd
        modules: ''
        # Флаг-хак: предотвращает падение aqtinstall из-за сетевых таймаутов реестра WindowsApps
        aqtflags: '--p7zip C:\Program` Files\7-Zip\7z.exe'

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: |
        cd build
        # Генератор NMake / Ninja (MSVC) создаст чистый бинарник без конфликтов GCC
        cmake -DCMAKE_BUILD_TYPE=Release -G "NMake Makefiles" ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Deploy Windows Binary (windeployqt)
      run: |
        cd build
        windeployqt --qmldir ../qml Release/spritesize.exe
        copy spritesize_en.qm Release\
        copy spritesize_ru.qm Release\

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Windows
        path: build/Release/

  # ================= СБОРКА ПОД LINUX (Qt 6.11) =================
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev

    - name: Install Qt 6.11
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.11.2'
        host: 'linux'
        target: 'desktop'
        modules: ''

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Prepare Linux Package
      run: |
        mkdir -p dist
        cp build/spritesize dist/
        cp build/spritesize_en.qm dist/
        cp build/spritesize_ru.qm dist/

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Linux
        path: dist/
