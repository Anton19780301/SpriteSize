name: Build SpriteSize

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:

  # ============================================
  # WINDOWS
  # ============================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtdeclarative qttools"
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          windeployqt `
            --release `
            --qmldir "${{ github.workspace }}/qml" `
            --dir dist `
            "build/Release/spritesize.exe"

          Copy-Item `
            "build/Release/spritesize.exe" `
            "dist/spritesize.exe"

          if (Test-Path "build/spritesize_en.qm") {
              Copy-Item "build/spritesize_en.qm" "dist/"
          }

          if (Test-Path "build/spritesize_ru.qm") {
              Copy-Item "build/spritesize_ru.qm" "dist/"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpriteSize-Windows
          path: dist/


  # ============================================
  # LINUX
  # ============================================
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove Google Chrome repository
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources

      - name: Update apt
        run: |
          sudo apt-get clean
          sudo apt-get update

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          host: linux
          target: desktop
          modules: "qtdeclarative qttools"
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Prepare Linux package
        shell: bash
        run: |
          mkdir -p dist

          cp build/spritesize dist/

          if [ -f build/spritesize_en.qm ]; then
            cp build/spritesize_en.qm dist/
          fi

          if [ -f build/spritesize_ru.qm ]; then
            cp build/spritesize_ru.qm dist/
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpriteSize-Linux
          path: dist/
