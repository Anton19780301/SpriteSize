name: Build SpriteSize

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  # ================= СБОРКА ПОД WINDOWS (БЫСТРАЯ С ХАКОМ СИСТЕМЫ) =================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # УЛЬТИМАТИВНЫЙ ХАК: Удаляем виндовый ярлык-пустышку python.exe из WindowsApps,
    # который блокировал права доступа и ломал aqtinstall!
    - name: Fix Windows Apps Python Execution Alias
      run: |
        Remove-Item -Force "$env:USERPROFILE\AppData\Local\Microsoft\WindowsApps\python.exe" -ErrorAction SilentlyContinue
        Remove-Item -Force "$env:USERPROFILE\AppData\Local\Microsoft\WindowsApps\python3.exe" -ErrorAction SilentlyContinue

    - name: Pre-install aqtinstall
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install aqtinstall

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0' 
        host: 'windows'
        target: 'desktop'
        # Используем win64_msvc2022. Экшен поддерживает это имя, если python работает штатно!
        arch: 'win64_msvc2022' 
        modules: '' 

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: |
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Deploy Windows Binary (windeployqt)
      run: |
        cd build
        windeployqt --qmldir ../qml Release/spritesize.exe
        copy spritesize_en.qm Release\
        copy spritesize_ru.qm Release\

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Windows
        path: build/Release/

  # ================= СБОРКА ПОД LINUX (РАБОТАЕТ ШТАТНО) =================
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'linux'
        target: 'desktop'
        modules: ''

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Prepare Linux Package
      run: |
        mkdir -p dist
        cp build/spritesize dist/
        cp build/spritesize_en.qm dist/
        cp build/spritesize_ru.qm dist/

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Linux
        path: dist/
