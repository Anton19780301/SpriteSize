name: Build SpriteSize

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  # ================= СБОРКА ПОД WINDOWS (ПРОМЫШЛЕННЫЙ СТАНДАРТ MSBUILD) =================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Подключаем официальный компилятор и сборщик Microsoft MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Вместо капризных скриптов скачиваем официальные бинарники Qt 6.8 LTS через Chocolatey
    # (Это встроенный в Windows-сервер надежный менеджер пакетов, он ставит всё за 1 минуту)
    - name: Install Qt6 via Chocolatey
      run: |
        choco install qt6-base -y --no-progress

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: |
        cd build
        # Указываем CMake путь к установленной через choco библиотеке Qt6
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:\tools\Qt\6.8.0\msvc2022_64" ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Deploy Windows Binary (windeployqt)
      run: |
        cd build
        # Вызываем windeployqt из папки choco для упаковки всех нужных .dll
        & "C:\tools\Qt\6.8.0\msvc2022_64\bin\windeployqt.exe" --qmldir ../qml Release/spritesize.exe
        copy spritesize_en.qm Release\
        copy spritesize_ru.qm Release\

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Windows
        path: build/Release/

  # ================= СБОРКА ПОД LINUX (УЖЕ РАБОТАЕТ ШТАТНО) =================
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'linux'
        target: 'desktop'
        modules: ''

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Prepare Linux Package
      run: |
        mkdir -p dist
        cp build/spritesize dist/
        cp build/spritesize_en.qm dist/
        cp build/spritesize_ru.qm dist/

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Linux
        path: dist/
