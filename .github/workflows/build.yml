name: Build SpriteSize

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  # ================= СБОРКА ПОД WINDOWS (VCPKG СТАНДАРТ) =================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # ИСПРАВЛЕНО: Вместо install-qt-action разворачиваем базовое ядро Qt6 через vcpkg.
    # Это полностью обходит баг WindowsApps/python.EXE с правами доступа!
    - name: Install Qt6 via vcpkg
      run: |
        vcpkg install qtbase:x64-windows qtdeclarative:x64-windows qtlanguageserver:x64-windows qttools:x64-windows

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: |
        cd build
        # Интегрируем vcpkg-тулчейн, чтобы CMake автоматически подцепил установленный Qt6
        cmake -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Deploy Windows Binary
      run: |
        cd build
        # Находим windeployqt внутри папки vcpkg и упаковываем .dll
        $vcpkgQtBin = "C:/vcpkg/packages/qtbase_x64-windows/tools/qt6/bin"
        if (Test-Path "$vcpkgQtBin/windeployqt.exe") {
            & "$vcpkgQtBin/windeployqt.exe" --qmldir ../qml Release/spritesize.exe
        }
        copy spritesize_en.qm Release\
        copy spritesize_ru.qm Release\

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Windows
        path: build/Release/

  # ================= СБОРКА ПОД LINUX (УЖЕ РАБОТАЕТ) =================
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'linux'
        target: 'desktop'
        modules: ''

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Prepare Linux Package
      run: |
        mkdir -p dist
        cp build/spritesize dist/
        cp build/spritesize_en.qm dist/
        cp build/spritesize_ru.qm dist/

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Linux
        path: dist/
