name: Build SpriteSize

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  # ============================================================
  # WINDOWS
  # ============================================================
  build-windows:
    runs-on: windows-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # MSVC
      # --------------------------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1


      # --------------------------------------------------------
      # Install Qt 6.11.2
      #
      # Используем fork aqtinstall, потому что официальный
      # aqtinstall 3.3.0 пока имеет проблему с новой структурой
      # репозитория Qt 6.11.x.
      # --------------------------------------------------------
      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          host: windows
          target: desktop
          arch: win64_msvc2022_64

          archives: "qtbase qtdeclarative qttools"

          aqtsource: "git+https://github.com/Holt59/aqtinstall.git"

          cache: true


      # --------------------------------------------------------
      # Проверяем Qt
      # --------------------------------------------------------
      - name: Check Qt installation
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"

          Write-Host ""
          Write-Host "qmake:"
          qmake --version

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "windeployqt:"
          where.exe windeployqt


      # --------------------------------------------------------
      # Configure CMake
      # --------------------------------------------------------
      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build application
        run: |
          cmake --build build `
            --config Release `
            --parallel


      # --------------------------------------------------------
      # Prepare Windows distribution
      # --------------------------------------------------------
      - name: Deploy Qt libraries
        shell: pwsh
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist | Out-Null


          Write-Host "Deploying Qt libraries..."

          windeployqt `
            --release `
            --qmldir "${{ github.workspace }}/qml" `
            --dir dist `
            "build/Release/spritesize.exe"


          Write-Host "Copying application..."

          Copy-Item `
            "build/Release/spritesize.exe" `
            "dist/spritesize.exe"


          Write-Host "Searching for translation files..."

          Get-ChildItem `
            -Path build `
            -Filter "*.qm" `
            -Recurse `
            -ErrorAction SilentlyContinue |
          ForEach-Object {

            Write-Host "Copying:"
            Write-Host $_.FullName

            Copy-Item `
              $_.FullName `
              "dist/"
          }


          Write-Host ""
          Write-Host "Windows distribution:"
          Get-ChildItem -Recurse dist


      # --------------------------------------------------------
      # Upload Windows artifact
      # --------------------------------------------------------
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpriteSize-Windows
          path: dist/


  # ============================================================
  # LINUX
  # ============================================================
  build-linux:
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Disable broken Google Chrome repository
      # --------------------------------------------------------
      - name: Disable Google Chrome apt repository
        shell: bash
        run: |

          echo "Searching for Google Chrome apt repositories..."

          sudo grep -RIl "dl.google.com/linux/chrome" \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d \
            2>/dev/null |
          while read -r file; do

            echo "Disabling:"
            echo "$file"

            sudo mv "$file" "$file.disabled"

          done


          echo ""
          echo "Remaining Google repositories:"

          sudo grep -RIn "dl.google.com" \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d \
            2>/dev/null || true


      # --------------------------------------------------------
      # Clean apt
      # --------------------------------------------------------
      - name: Clean apt cache
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean


      # --------------------------------------------------------
      # Update apt
      # --------------------------------------------------------
      - name: Update apt
        run: |
          sudo apt-get update


      # --------------------------------------------------------
      # Linux dependencies
      # --------------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev


      # --------------------------------------------------------
      # Install Qt 6.11.2
      # --------------------------------------------------------
      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          host: linux
          target: desktop

          archives: "qtbase qtdeclarative qttools"

          cache: true


      # --------------------------------------------------------
      # IMPORTANT:
      # Qt 6.11.2 contains its own ICU libraries.
      #
      # Добавляем и Qt root, и Qt/lib в runtime search path.
      # --------------------------------------------------------
      - name: Configure Qt runtime paths
        shell: bash
        run: |

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

          echo "LD_LIBRARY_PATH before:"
          echo "$LD_LIBRARY_PATH"

          echo "LD_LIBRARY_PATH=$QT_ROOT_DIR:$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH" \
            >> "$GITHUB_ENV"

          echo "PATH=$QT_ROOT_DIR/bin:$PATH" \
            >> "$GITHUB_ENV"

          echo ""
          echo "Qt files:"

          ls -la "$QT_ROOT_DIR" || true

          echo ""
          echo "ICU libraries:"

          find "$QT_ROOT_DIR" \
            -maxdepth 2 \
            -type f \
            -name "libicu*.so*" \
            -print || true


      # --------------------------------------------------------
      # Check Qt
      # --------------------------------------------------------
      - name: Check Qt installation
        shell: bash
        run: |

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

          echo ""
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

          echo ""
          echo "Qt version:"

          qmake --version

          echo ""
          echo "CMake version:"

          cmake --version


      # --------------------------------------------------------
      # Configure CMake
      # --------------------------------------------------------
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build application
        run: |
          cmake --build build \
            --config Release \
            --parallel


      # --------------------------------------------------------
      # Prepare Linux distribution
      # --------------------------------------------------------
      - name: Prepare Linux package
        shell: bash
        run: |

          mkdir -p dist


          echo "Copy executable..."

          cp build/spritesize \
             dist/spritesize


          echo ""
          echo "Searching for QM files..."

          find build \
            -type f \
            -name "*.qm" \
            -exec cp {} dist/ \;


          echo ""
          echo "Linux distribution:"

          find dist \
            -maxdepth 2 \
            -type f \
            -print


      # --------------------------------------------------------
      # Upload Linux artifact
      # --------------------------------------------------------
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpriteSize-Linux
          path: dist/
