name: Build SpriteSize

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  # ================= СБОРКА ПОД WINDOWS =================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # Скачиваем ТОЛЬКО готовые скомпилированные DLL ядра Qt6. 
    # Отключаем тяжелые фичи (ssl), чтобы сервер не пытался компилировать OpenSSL из исходников
    - name: Install Qt6 via vcpkg (Binary Package)
      run: |
        vcpkg install qtbase[core,gui,widgets,network]:x64-windows qtdeclarative:x64-windows qttools:x64-windows

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: |
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Deploy Windows Binary (windeployqt)
      run: |
        cd build
        $vcpkgQtBin = "C:/vcpkg/packages/qtbase_x64-windows/tools/qt6/bin"
        if (Test-Path "$vcpkgQtBin/windeployqt.exe") {
            & "$vcpkgQtBin/windeployqt.exe" --qmldir ../qml Release/spritesize.exe
        }
        copy spritesize_en.qm Release\
        copy spritesize_ru.qm Release\

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Windows
        path: build/Release/

  # ================= СБОРКА ПОД LINUX =================
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies & Qt6
      run: |
        sudo apt-get update
        # Ставим полноценный компилятор и официальный чистый пакет Qt6 напрямую из Ubuntu
        sudo apt-get install -y build-essential libgl1-mesa-dev qt6-base-dev qt6-declarative-dev qt6-l10n-tools qt6-tools-dev-tools

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Prepare Linux Package
      run: |
        mkdir -p dist
        cp build/spritesize dist/
        cp build/spritesize_en.qm dist/
        cp build/spritesize_ru.qm dist/

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Linux
        path: dist/
