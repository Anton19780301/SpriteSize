build-linux:
  runs-on: ubuntu-24.04

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Disable Google Chrome apt repository
      shell: bash
      run: |
        sudo grep -RIl "dl.google.com/linux/chrome" \
          /etc/apt/sources.list \
          /etc/apt/sources.list.d \
          2>/dev/null \
          | while read -r file; do
            echo "Disabling: $file"
            sudo mv "$file" "$file.disabled"
          done

    - name: Clean apt
      run: |
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get clean
        sudo apt-get update

    - name: Install Linux dependencies
      run: |
        sudo apt-get install -y \
          build-essential \
          libgl1-mesa-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev

    - name: Install Qt 6.11
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.11.2"
        host: linux
        target: desktop
        archives: "qtbase qtdeclarative qttools"
        cache: true

    - name: Show Qt
      run: |
        qmake --version || true
        echo "QT_ROOT_DIR=$QT_ROOT_DIR"

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build \
          --config Release \
          --parallel

    - name: Prepare Linux package
      shell: bash
      run: |
        mkdir -p dist

        cp build/spritesize dist/

        find build -name "*.qm" -exec cp {} dist/ \;

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Linux
        path: dist/