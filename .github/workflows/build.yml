name: Build SpriteSize

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  # ================= СБОРКА ПОД WINDOWS (СТАБИЛЬНЫЙ MSVC) =================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Инициализируем компилятор MSVC, встроенный в Windows-сервер по умолчанию
    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # Обходим баг прав доступа WindowsApps/python.EXE
    - name: Pre-install aqtinstall
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install aqtinstall

    # Найдите этот блок в .github/workflows/build.yml и обновите строку arch:
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0' 
        host: 'windows'
        target: 'desktop'
        # ИСПРАВЛЕНО: Убрали "2022", теперь имя архитектуры в базах Qt 6.8+ пишется просто как win64_msvc
        arch: 'win64_msvc' 
        modules: '' 

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: |
        cd build
        # CMake автоматически выберет MSVC компилятор вместо капризного MinGW
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Deploy Windows Binary (windeployqt)
      run: |
        cd build
        # windeployqt соберет все нужные .dll под MSVC в папку релиза
        windeployqt --qmldir ../qml Release/spritesize.exe
        copy spritesize_en.qm Release\
        copy spritesize_ru.qm Release\

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Windows
        path: build/Release/

  # ================= СБОРКА ПОД LINUX (УЖЕ РАБОТАЕТ) =================
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'linux'
        target: 'desktop'
        modules: ''

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..

    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release

    - name: Prepare Linux Package
      run: |
        mkdir -p dist
        cp build/spritesize dist/
        cp build/spritesize_en.qm dist/
        cp build/spritesize_ru.qm dist/

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpriteSize-Linux
        path: dist/
